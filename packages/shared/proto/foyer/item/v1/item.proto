syntax = "proto3";

package foyer.item.v1;

import "google/protobuf/timestamp.proto";

// A task, event or note. It lives in one space, which decides who can see and change it: every
// member who can see the space. Devices receive the items they can see.
message Item {
  // A UUID version 7, made by the device that created the item.
  string id = 1;
  ItemKind kind = 2;
  // The space it lives in.
  string space_id = 3;
  // Trimmed, never blank, and at most 500 Unicode code points.
  string title = 4;
  // Plain text of at most 10,000 Unicode code points, or empty.
  string description = 5;
  // A day, as a plain ISO 8601 date such as "2026-11-17", with no time or time zone. Empty when it
  // has none.
  string date = 6;
  // The member who created it.
  string created_by = 7;
  // When it was created, by the clock of the device that created it.
  google.protobuf.Timestamp created_at = 8;
  // The rule a repeating task follows, as an iCalendar RRULE such as "FREQ=WEEKLY;BYDAY=TU", or
  // empty for an item that doesn't repeat. A repeating task always has a date: its next occurrence.
  string repeat = 9;
  // Where a repeating task's next date comes from. Unspecified when it doesn't repeat.
  RepeatFrom repeat_from = 10;
}

// Where a repeating task's next date comes from when it's ticked.
enum RepeatFrom {
  REPEAT_FROM_UNSPECIFIED = 0;
  // The rule's own dates, whenever it was ticked, such as bins every Tuesday.
  REPEAT_FROM_SCHEDULE = 1;
  // The day it was ticked, such as watering the plants 3 days after the last watering.
  REPEAT_FROM_COMPLETION = 2;
}

// What an item is. Turning an item into another kind keeps its id, its stickers and its pages.
enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  // Something to do, which can be ticked.
  ITEM_KIND_TASK = 1;
  // Something that happens at a time, such as an appointment.
  ITEM_KIND_EVENT = 2;
  // Something written down, on pages of its own.
  ITEM_KIND_NOTE = 3;
}

// Creates an item. A device sends it with the item's sticker on its space's page, in the same push.
// Only tasks can be created for now.
message ItemCreate {
  // A new UUID version 7, made by the device.
  string item_id = 1;
  ItemKind kind = 2;
  // The space it goes in, which the member must see.
  string space_id = 3;
  // Trimmed, then refused if blank or over 500 Unicode code points.
  string title = 4;
  // Plain text, refused if over 10,000 Unicode code points, or empty.
  string description = 5;
  // A plain ISO 8601 date such as "2026-11-17", or empty for none.
  string date = 6;
}

// Changes an item's title. Each field's change made last wins, by the device's clock, so changes to
// different fields never conflict. Anyone who can see the item's space can change it.
message ItemSetTitle {
  string item_id = 1;
  // Trimmed, then refused if blank or over 500 Unicode code points.
  string title = 2;
}

// Changes an item's description. The change made last wins, by the device's clock.
message ItemSetDescription {
  string item_id = 1;
  // Plain text, refused if over 10,000 Unicode code points, or empty.
  string description = 2;
}

// Changes an item's date, or clears it. The change made last wins, by the device's clock. A
// repeating task's date can't be cleared.
message ItemSetDate {
  string item_id = 1;
  // A plain ISO 8601 date such as "2026-11-17", or empty to clear it.
  string date = 2;
}

// Sets the rule a task repeats by, and where its next date comes from, or stops it repeating. The
// change made last wins. A task needs a date to repeat, so a device setting a rule on a dateless
// task sends an ItemSetDate with the rule's first date from today before this, in the same push.
message ItemSetRepeat {
  string item_id = 1;
  // An iCalendar RRULE, or empty to stop it repeating. The household takes FREQ and INTERVAL, with
  // weekly BYDAY of plain days, monthly BYMONTHDAY or one BYDAY with its place, such as -1FR, and
  // yearly BYMONTH with BYMONTHDAY. It refuses any other rule.
  string repeat = 2;
  // Required with a rule. Ignored when the rule is empty.
  RepeatFrom repeat_from = 3;
}

// Moves an item to another space, which changes who sees it: members who can't see the new space
// receive it as deleted. A device sends it with the sticker moving from the old space's page to the
// new one's, in the same push. The move made last wins, by the device's clock.
message ItemMove {
  string item_id = 1;
  // A space the member sees, as they must see the item's space now.
  string space_id = 2;
}

// Deletes an item, and its stickers on every page.
message ItemDelete {
  string item_id = 1;
}
