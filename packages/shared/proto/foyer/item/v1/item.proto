syntax = "proto3";

package foyer.item.v1;

import "google/protobuf/timestamp.proto";

// A task, event or note. It lives in one space, which decides who can see and change it: every
// member who can see the space. Devices receive the items they can see.
message Item {
  // A UUID version 7, made by the device that created the item.
  string id = 1;
  ItemKind kind = 2;
  // The space it lives in.
  string space_id = 3;
  // Trimmed, never blank, and at most 500 Unicode code points.
  string title = 4;
  // Plain text of at most 10,000 Unicode code points, or empty.
  string description = 5;
  // A day, as a plain ISO 8601 date such as "2026-11-17", with no time or time zone. Empty when it
  // has none. An event's is the day it starts in its Google calendar's time zone, which only the
  // household sets.
  string date = 6;
  // The member who created it. Empty for an event added in Google Calendar.
  string created_by = 7;
  // When it was created, by the clock of the device that created it, or Google's for an event added
  // in Google Calendar.
  google.protobuf.Timestamp created_at = 8;
  // The rule a repeating task follows, as an iCalendar RRULE such as "FREQ=WEEKLY;BYDAY=TU", or
  // empty for an item that doesn't repeat. A repeating task always has a date: its next occurrence.
  string repeat = 9;
  // Where a repeating task's next date comes from. Unspecified when it doesn't repeat.
  RepeatFrom repeat_from = 10;
  // The task or note it's under, which is in the same space, or empty at the top of its space.
  string parent_id = 11;
  // When an event happens: an all-day event has starts_on and ends_on, and one with times has
  // starts_at and ends_at. All four are empty for tasks and notes.
  // The first day of an all-day event, as a plain ISO 8601 date.
  string starts_on = 12;
  // The last day of an all-day event, as a plain ISO 8601 date: the same as starts_on for an event
  // of one day.
  string ends_on = 13;
  // When an event with times starts.
  google.protobuf.Timestamp starts_at = 14;
  // When an event with times ends, which is never before it starts.
  google.protobuf.Timestamp ends_at = 15;
}

// Where a repeating task's next date comes from when it's ticked.
enum RepeatFrom {
  REPEAT_FROM_UNSPECIFIED = 0;
  // The rule's own dates, whenever it was ticked, such as bins every Tuesday.
  REPEAT_FROM_SCHEDULE = 1;
  // The day it was ticked, such as watering the plants 3 days after the last watering.
  REPEAT_FROM_COMPLETION = 2;
}

// What an item is. Turning an item into another kind keeps its id, its stickers and its pages.
enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  // Something to do, which can be ticked.
  ITEM_KIND_TASK = 1;
  // Something that happens at a time, such as an appointment.
  ITEM_KIND_EVENT = 2;
  // Something written down, on pages of its own.
  ITEM_KIND_NOTE = 3;
}

// Creates an item. A device sends a task with its sticker on its space's page, in the same push.
// Only tasks and events can be created for now. An event can only be created in a space with a
// Google calendar, whose calendar_state isn't none, and the household writes it to that calendar.
message ItemCreate {
  // A new UUID version 7, made by the device.
  string item_id = 1;
  ItemKind kind = 2;
  // The space it goes in, which the member must see.
  string space_id = 3;
  // Trimmed, then refused if blank or over 500 Unicode code points.
  string title = 4;
  // Plain text, refused if over 10,000 Unicode code points, or empty.
  string description = 5;
  // A plain ISO 8601 date such as "2026-11-17", or empty for none. Always empty for an event, whose
  // date the household sets.
  string date = 6;
  // When an event happens, as in Item, and required for one: either starts_on and ends_on, or
  // starts_at and ends_at. Refused for any other kind.
  string starts_on = 7;
  string ends_on = 8;
  google.protobuf.Timestamp starts_at = 9;
  google.protobuf.Timestamp ends_at = 10;
}

// Changes an item's title. Each field's change made last wins, by the device's clock, so changes to
// different fields never conflict. Anyone who can see the item's space can change it.
message ItemSetTitle {
  string item_id = 1;
  // Trimmed, then refused if blank or over 500 Unicode code points.
  string title = 2;
}

// Changes an item's description. The change made last wins, by the device's clock.
message ItemSetDescription {
  string item_id = 1;
  // Plain text, refused if over 10,000 Unicode code points, or empty.
  string description = 2;
}

// Changes an item's date, or clears it. The change made last wins, by the device's clock. A
// repeating task's date can't be cleared, and an event's is set by the household from when it
// starts, so this is refused on an event.
message ItemSetDate {
  string item_id = 1;
  // A plain ISO 8601 date such as "2026-11-17", or empty to clear it.
  string date = 2;
}

// Sets the rule a task repeats by, and where its next date comes from, or stops it repeating. The
// change made last wins. A task needs a date to repeat, so a device setting a rule on a dateless
// task sends an ItemSetDate with the rule's first date from today before this, in the same push.
message ItemSetRepeat {
  string item_id = 1;
  // An iCalendar RRULE, or empty to stop it repeating. The household takes FREQ and INTERVAL, with
  // weekly BYDAY of plain days, monthly BYMONTHDAY or one BYDAY with its place, such as -1FR, and
  // yearly BYMONTH with BYMONTHDAY. It refuses any other rule.
  string repeat = 2;
  // Required with a rule. Ignored when the rule is empty.
  RepeatFrom repeat_from = 3;
}

// Moves an item, and everything under it, to another space, which changes who sees them; a device
// moves a task's sticker to the new space's page in the same push. The move made last wins. An item
// under another must be taken out first. Events go only to a space with a Google calendar.
message ItemMove {
  string item_id = 1;
  // A space the member sees, as they must see the item's space now.
  string space_id = 2;
}

// Deletes an item, and its stickers on every page. Items still under it move up to its parent, or
// to the top of its space. An event is deleted in Google Calendar too.
message ItemDelete {
  string item_id = 1;
}

// Puts an item under a task or note, or back at the top of its space. An item under a parent in
// another space moves into that space, with everything under it. The change made last wins. A
// device sends it with the item's sticker moving to the parent's body page, in the same push.
message ItemSetParent {
  string item_id = 1;
  // A task or note the member sees, other than the item or anything under it, or empty for the top
  // of the item's space.
  string parent_id = 2;
}
