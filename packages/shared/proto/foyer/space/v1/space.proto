syntax = "proto3";

package foyer.space.v1;

// A container for tasks, events and notes that decides who can see and change them. Every member
// who can see a space can edit its items. Devices receive the spaces they can see.
message Space {
  // A UUID version 7, made by the device that created the space, or by the backend for the spaces
  // a member gets when they join.
  string id = 1;
  SpaceKind kind = 2;
  // The member whose Inbox or personal space it is. Empty for shared spaces.
  string owner_id = 3;
  // Such as "Work" or "Home". Empty for the Inbox, which has no name.
  string name = 4;
  // The member whose Google account holds the space's calendar. Empty until it has one. Only the
  // household sets it.
  string calendar_member_id = 5;
  // Whether the space's calendar exists and is kept in step with Google. Only the household sets
  // it.
  CalendarState calendar_state = 6;
  // Whether the space is archived: read-only, and left out of every list and space picker, with
  // its items, pages and stickers kept. Devices keep receiving an archived space and its items.
  bool archived = 7;
}

// Where a space's Google calendar stands. Each space except the Inbox gets one: a personal space's
// in its owner's Google account, a shared space's in its creator's, or, if they haven't connected
// Google, in the account of the member who connected first.
enum CalendarState {
  CALENDAR_STATE_UNSPECIFIED = 0;
  // The space has no calendar yet: nobody who can hold it has connected Google, or the household is
  // still creating it. The Inbox always has none.
  CALENDAR_STATE_NONE = 1;
  // The calendar exists and the household can use it.
  CALENDAR_STATE_SYNCING = 2;
  // The calendar exists, but its holder's access stopped working or they disconnected. Connecting
  // again resumes it.
  CALENDAR_STATE_PAUSED = 3;
}

// Who a space is for, which decides who sees it.
enum SpaceKind {
  SPACE_KIND_UNSPECIFIED = 0;
  // A member's private Inbox, which holds their quick captures until they file them into another
  // space. Each member has exactly one, made when they join. It can't be created, renamed or
  // deleted.
  SPACE_KIND_INBOX = 1;
  // A space only its owner sees, such as "Work" or "Garden plans". A member can have several, and
  // gets one named "Personal" when they join.
  SPACE_KIND_PERSONAL = 2;
  // A space every member of the household sees, including members who join later.
  SPACE_KIND_SHARED = 3;
}

// Creates a personal or shared space. A personal space belongs to the member who creates it.
message SpaceCreate {
  // A new UUID version 7, made by the device.
  string space_id = 1;
  // SPACE_KIND_PERSONAL or SPACE_KIND_SHARED. An Inbox can't be created.
  SpaceKind kind = 2;
  // Trimmed, then refused if blank or over 120 Unicode code points. If it clashes, ignoring case,
  // with a shared space's or one of the creator's personal spaces', archived ones included, the
  // household numbers it, as in "Groceries 2", shortening the name before the number to fit.
  string name = 3;
}

// Renames a personal or shared space. Only its owner can rename a personal space, and neither the
// Inbox nor an archived space can be renamed. The rename made last wins, by the device's clock.
message SpaceRename {
  string space_id = 1;
  // Trimmed, then refused if blank or over 120 Unicode code points, or if it clashes, ignoring case,
  // with another shared space's or one of the renamer's personal spaces', archived ones included.
  // A rename that loses to one made later has no effect and isn't checked.
  string name = 2;
}

// Archives a personal or shared space, or restores it; the change made last wins, by the device's
// clock. Only its owner can archive or restore a personal space, and the Inbox can't be archived.
// Inside an archived space, every change is refused, and its Google calendar isn't kept in step.
message SpaceSetArchived {
  string space_id = 1;
  bool archived = 2;
}
