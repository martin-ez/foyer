syntax = "proto3";

package foyer.sync.v1;

import "foyer/calendar/v1/calendar.proto";
import "foyer/event/v1/event.proto";
import "foyer/item/v1/item.proto";
import "foyer/member/v1/member.proto";
import "foyer/page/v1/page.proto";
import "foyer/space/v1/space.proto";
import "foyer/sticker/v1/sticker.proto";
import "foyer/sync/v1/live.proto";
import "foyer/task/v1/task.proto";
import "google/protobuf/timestamp.proto";

// Sync keeps devices up to date over a WebSocket at the backend's /sync address, which carries the
// session as calls do, and the live lane in live.proto. Each binary message holds one DeviceMessage
// or one HouseholdMessage. The text "ping" is answered with "pong", to keep the connection open.

// What a device sends the household.
message DeviceMessage {
  oneof message {
    Push push = 1;
    Pull pull = 2;
    Enter enter = 3;
    Leave leave = 4;
    Point point = 5;
  }
}

// Changes the device made, in the order it made them. The household answers with Committed, after
// sending the rows they changed as Updates.
message Push {
  // A UUID version 7, made by the device, which Committed repeats.
  string push_id = 1;
  repeated Change changes = 2;
}

// A change to the household's data.
message Change {
  // A UUID version 7, made by the device when the change is made and kept when the change is sent
  // again. A change the household received in the last 90 days has no further effect, and is
  // answered as it was the first time.
  string change_id = 1;
  // When the person made the change, by their device's clock. A change only replaces a value if it
  // was made after the change that set it, with equal times settled by the larger change_id. A time
  // later than the household's clock counts as the household's time. Required.
  google.protobuf.Timestamp at = 2;
  oneof change {
    foyer.space.v1.SpaceCreate space_create = 3;
    foyer.space.v1.SpaceRename space_rename = 4;
    foyer.page.v1.PageCreate page_create = 5;
    foyer.item.v1.ItemCreate item_create = 6;
    foyer.sticker.v1.StickerPlace sticker_place = 7;
    foyer.sticker.v1.StickerMove sticker_move = 8;
    foyer.sticker.v1.StickerRemove sticker_remove = 9;
    foyer.item.v1.ItemSetTitle item_set_title = 10;
    foyer.item.v1.ItemSetDescription item_set_description = 11;
    foyer.item.v1.ItemSetDate item_set_date = 12;
    foyer.item.v1.ItemMove item_move = 13;
    foyer.item.v1.ItemDelete item_delete = 14;
    foyer.task.v1.TaskTick task_tick = 15;
    foyer.task.v1.TaskUntick task_untick = 16;
    foyer.item.v1.ItemSetRepeat item_set_repeat = 17;
    foyer.item.v1.ItemSetParent item_set_parent = 18;
    foyer.event.v1.EventSetTime event_set_time = 19;
    foyer.item.v1.ItemSetTime item_set_time = 20;
  }
}

// Asks for the rows the device can see that changed after its cursor. Answered with a PullReply.
message Pull {
  // The cursor the device has caught up to, or 0 for everything.
  int64 cursor = 1;
}

// What the household sends a device.
message HouseholdMessage {
  oneof message {
    Welcome welcome = 1;
    Committed committed = 2;
    Updates updates = 3;
    PullReply pull_reply = 4;
    Here here = 5;
    Pointed pointed = 6;
    LiveLimit live_limit = 7;
  }
}

// Sent first, when the connection opens.
message Welcome {
  // The number of the household's latest change.
  int64 seq = 1;
}

// What became of each change in a push.
message Committed {
  string push_id = 1;
  // One for each change in the push, in the same order.
  repeated ChangeResult results = 2;
}

// What became of a change.
message ChangeResult {
  string change_id = 1;
  oneof result {
    // The number the household gave the change when it committed it. A change that lost a conflict
    // is committed too, with no effect.
    int64 seq = 2;
    // The household couldn't apply the change. The device undoes it.
    Refusal refused = 3;
  }
}

// Why the household refused a change.
message Refusal {
  // A sentence in English, such as "Only its owner can rename a personal space."
  string reason = 1;
}

// Rows a change just changed, sent to every connected device that can see them, the device that
// made the change included. A change that had no effect sends that device its rows as they are.
message Updates {
  repeated Row rows = 1;
}

// The rows the device can see that changed after a Pull's cursor, oldest change first. A long
// catch-up takes several replies.
message PullReply {
  repeated Row rows = 1;
  // Where the next Pull starts: the device has caught up to here once it holds these rows.
  int64 cursor = 2;
  // Whether the device has caught up with every change so far. If not, it pulls again from cursor.
  bool done = 3;
}

// A row as the household holds it now.
message Row {
  // The number of the row's last change. A device keeps the row with the larger number.
  int64 seq = 1;
  oneof row {
    foyer.member.v1.Member member = 2;
    foyer.space.v1.Space space = 3;
    // A row that was deleted, which the device drops.
    RowRef deleted = 4;
    foyer.page.v1.Page page = 5;
    foyer.item.v1.Item item = 6;
    foyer.sticker.v1.Sticker sticker = 7;
    foyer.task.v1.Completion completion = 8;
    foyer.calendar.v1.GoogleConnection google_connection = 9;
  }
}

// Which row: its kind and its id.
message RowRef {
  RowKind kind = 1;
  string id = 2;
}

// The kinds of row the household holds.
enum RowKind {
  ROW_KIND_UNSPECIFIED = 0;
  ROW_KIND_MEMBER = 1;
  ROW_KIND_SPACE = 2;
  ROW_KIND_PAGE = 3;
  ROW_KIND_ITEM = 4;
  ROW_KIND_STICKER = 5;
  ROW_KIND_COMPLETION = 6;
  ROW_KIND_GOOGLE_CONNECTION = 7;
}
