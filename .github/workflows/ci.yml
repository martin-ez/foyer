name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check that .nvmrc and engines agree with the Node version package.json pins
        run: |
          node -e '
            const pkg = require("./package.json");
            const pin = pkg.devEngines.runtime.version;
            const [, major, minor] = /^\^(\d+)\.(\d+)\.\d+$/.exec(pin) ?? [];
            const nvmrc = require("node:fs").readFileSync(".nvmrc", "utf8").trim();
            if (!major) {
              console.error(`devEngines.runtime in package.json should be a range like ^24.22.0, not ${pin}.`);
              process.exit(1);
            }
            if (nvmrc !== major || pkg.engines.node !== `>=${major}.${minor}`) {
              console.error(`devEngines.runtime in package.json pins Node ${pin}, so .nvmrc should be ${major} and engines.node >=${major}.${minor}, not ${nvmrc} and ${pkg.engines.node}.`);
              process.exit(1);
            }
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec biome ci .
      - name: Lint the contracts and check their formatting
        run: pnpm --filter @foyer/shared lint-contracts
      - name: Check that the contracts still work with apps and data made from main's
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin main:main
          if git cat-file -e main:packages/shared/buf.yaml 2>/dev/null; then
            pnpm --filter @foyer/shared check-breaking
          else
            echo "main has no contracts yet, so there is nothing to break."
          fi
      - run: pnpm test
      - name: Export the web app, as deploys do
        run: pnpm --filter @foyer/client export-web
